services:
  - type: web
    name: github-metrics
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Optional: set for accurate PR/issue/review stats and higher rate limits.
      # Without it the app falls back to public contribution data.
      - key: GITHUB_TOKEN
        sync: false
