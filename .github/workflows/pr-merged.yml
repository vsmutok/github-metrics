name: PR Merged Congratulator

on:
  pull_request_target:
    types: [closed]

jobs:
  congratulate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post Congratulatory Comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const creator = context.payload.pull_request.user.login;
            const { owner, repo } = context.repo;
            const repoUrl = `https://github.com/${owner}/${repo}`;
            const commentBody = `🎉 **Congratulations @${creator}!** 🎉

            Your pull request has been successfully merged into **${repo}**! Thank you so much for your valuable contribution and effort. Every single improvement helps make the project better for everyone! 🙌

            🚀 **What's Next?**
            - **Keep the momentum going!** Feel free to browse through our open **[Issues](${repoUrl}/issues)** and grab another one that interests you!
            - **Support the Project:** If you enjoyed contributing, **please take a second to [star the repository](${repoUrl})**! It helps increase the project's visibility and supports the community. ⭐

            💬 **Stay Connected:**
            Have any questions, want feedback, or just want to discuss further contributions? Feel free to open a discussion or issue in the repository!

            Thank you again, and keep up the amazing work! 💻✨`;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: commentBody
            });
